name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Ein Lauf nach dem anderen; ein neuer Push ersetzt einen noch wartenden
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Zwei getrennte Jobs (Vorgabe von GitHub): Das Paket ist dann sicher
  # hochgeladen und registriert, bevor veröffentlicht wird. In einem einzigen
  # Job fand deploy-pages es gelegentlich nicht ("No artifacts named github-pages").
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
